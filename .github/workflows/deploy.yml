name: CI & Deploy App-icol PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, Unit Tests & Build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit & component tests (Vitest)
        run: npm test

      - name: Build GAS bundle & Vite PWA
        env:
          VITE_DATA_MODE: ${{ vars.VITE_DATA_MODE || 'mock' }}
          VITE_AUTH_MODE: ${{ vars.VITE_AUTH_MODE || 'mock' }}
          VITE_GAS_WEBAPP_URL: ${{ vars.VITE_GAS_WEBAPP_URL || '' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '' }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
